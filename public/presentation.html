<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Top 5 Presentation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;height:100vh;width:100vw;font-family:-apple-system,sans-serif;}

/* Phone splash — shown inside the phone before iframe reveals */
#phone-splash{
  position:absolute;inset:0;z-index:5;
  background:#FFF;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.55s ease;
  border-radius:48px;
}
#phone-splash.hidden{opacity:0;pointer-events:none;}
#splash-logo{
  font-size:52px;font-weight:900;
  color:#FF4438;letter-spacing:-2px;
  font-family:-apple-system,'Helvetica Neue',sans-serif;
}
#phone-iframe{transition:opacity 0.55s ease;}

#slide-area{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#slide-img{max-width:100%;max-height:100%;object-fit:contain;display:block;}

#prev-zone{position:fixed;left:0;top:0;bottom:0;width:12%;z-index:55;cursor:w-resize;}
#next-zone{position:fixed;right:0;top:0;bottom:0;width:12%;z-index:55;cursor:e-resize;}

/* HUD — above nav zones (55) and overlay (50) */
#hud{position:fixed;bottom:0;left:0;right:0;padding:14px 24px;background:linear-gradient(to top,rgba(0,0,0,0.7),transparent);display:flex;align-items:center;justify-content:space-between;z-index:60;opacity:0;transition:opacity 0.2s;}
body:hover #hud{opacity:1;}
#counter{font-size:12px;color:rgba(255,255,255,0.55);font-weight:600;letter-spacing:0.5px;}
#dots{display:flex;gap:6px;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.25);cursor:pointer;transition:all 0.2s;}
.dot.active{background:#FF4438;width:18px;border-radius:3px;}
.dot.demo-dot{background:rgba(255,68,56,0.5);}
#hud-right{display:flex;align-items:center;gap:10px;}
#demo-hint{font-size:11px;color:rgba(255,68,56,0.7);letter-spacing:0.3px;}
#fs-btn{background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.6);font-size:14px;width:30px;height:30px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#fs-btn:hover{background:rgba(255,255,255,0.2);color:#FFF;}

:fullscreen #hud{display:none;}
:-webkit-full-screen #hud{display:none;}
:-moz-full-screen #hud{display:none;}

/* Overlay */
#resy-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;}
#resy-overlay.visible{pointer-events:all;}
#resy-backdrop{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);
  transition:background 1.1s ease, backdrop-filter 1.1s ease, -webkit-backdrop-filter 1.1s ease;
}
#resy-overlay.visible #resy-backdrop{
  background:rgba(0,0,0,0.62);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

/* Two-panel row — invisible until loaded, then fades/scales in smoothly */
#demo-row{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:24px;
  opacity:0;transform:translateX(122px) scale(0.96);
  transition:opacity 0.9s ease, transform 1s cubic-bezier(0.25,0.46,0.45,0.94);
  pointer-events:none;
}
#demo-row.loaded{opacity:1;transform:translateX(122px) scale(1);pointer-events:all;}
#demo-row.loaded.qr-active{transform:translateX(0) scale(1);transition:opacity 0.9s ease, transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94);}

/* Phone iframe */
#phone-wrap{
  position:relative;
  width:390px;height:844px;
  border-radius:48px;
  overflow:hidden;
  box-shadow:0 0 0 10px #1C1C1E,0 40px 80px rgba(0,0,0,0.8);
  flex-shrink:0;
  transform-origin:center center;
}
#phone-iframe{width:100%;height:100%;border:none;display:block;}

/* QR panel — invisible until group active; stays in layout so row offset math works */
#qr-panel{
  display:flex;flex-direction:column;align-items:center;gap:20px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:32px 28px;
  backdrop-filter:blur(10px);
  width:220px;flex-shrink:0;
  opacity:0;transform:translateX(20px) scale(0.95);
  transition:opacity 0.55s ease 0.25s, transform 0.6s cubic-bezier(0.16,1,0.3,1) 0.2s;
  pointer-events:none;
}
#qr-panel.active{opacity:1;transform:translateX(0) scale(1);pointer-events:all;}
#qr-img{width:164px;height:164px;border-radius:14px;background:#FFF;display:block;}
#qr-title{color:#FFF;font-size:14px;font-weight:700;text-align:center;}
#qr-sub{color:rgba(255,255,255,0.45);font-size:11px;text-align:center;line-height:1.5;}
#group-code{color:#FF4438;font-size:13px;font-weight:800;letter-spacing:1px;text-align:center;}

/* Peek overlay — iPhone shell, bottom-right */
#peek-overlay{
  position:fixed;bottom:100px;right:200px;
  width:200px;height:432px;
  z-index:45;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 6px #1C1C1E,0 16px 40px rgba(0,0,0,0.8);
  opacity:0;transform:translateY(14px) scale(0.97);
  transition:opacity 0.75s ease,transform 0.75s cubic-bezier(0.25,0.46,0.45,0.94);
  pointer-events:none;background:#000;
}
#peek-overlay.active{opacity:1;transform:translateY(0) scale(1);pointer-events:all;}
#peek-video{width:100%;height:100%;display:block;object-fit:cover;}

</style>
</head>
<body>

<div id="slide-area">
  <img id="slide-img" src="/slides/slide_001.png" alt="Slide"/>
</div>

<div id="prev-zone" onclick="if(overlayVisible)hideOverlay(); go(-1)"></div>
<div id="next-zone" onclick="if(overlayVisible)hideOverlay(); go(1)"></div>

<div id="hud">
  <span id="counter">1 / 8</span>
  <div id="dots"></div>
  <div id="hud-right">
    <span id="demo-hint"></span>
    <button id="fs-btn" onclick="toggleFullscreen()" title="Fullscreen (F)">⛶</button>
  </div>
</div>

<div id="resy-overlay">
  <div id="resy-backdrop" onclick="hideOverlay()"></div>
  <div id="demo-row">
    <div style="position:relative;flex-shrink:0;">
      <div id="phone-wrap">
        <div id="phone-splash"><span id="splash-logo">resy</span></div>
        <iframe id="phone-iframe" src="about:blank" style="opacity:0"></iframe>
      </div>
    </div>
    <div id="qr-panel">
      <img id="qr-img" src="" alt="QR"/>
      <div id="qr-title">Scan to join</div>
      <div id="group-code"></div>
      <div id="qr-sub">Open on your phone and swipe along with the demo</div>
    </div>
  </div>
</div>

<!-- Peek overlay — iPhone shell, bottom-right, between slide 1 and slide 2 -->
<div id="peek-overlay">
  <video id="peek-video" playsinline muted loop preload="auto" style="width:100%;height:100%;display:block;object-fit:cover;"></video>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Peek step: after slide 0, before slide 1 — swap in a video file path or YouTube embed URL
const PEEK_SLIDE = 0;
const PEEK_URL   = '/resy-discover.mp4';

const SLIDES     = ['/slides/slide_001.png','/slides/slide_002.png','/slides/slide_003.png','/slides/slide_004.png','/slides/slide_005.png','/slides/slide_006.png','/slides/slide_007.png','/slides/slide_008.png','/slides/slide_009.png'];
const DEMO_SLIDE = 7;
const RESY_URL   = 'https://resy-app-production.up.railway.app';

let cur = 0;
let overlayVisible  = false;
let iframeLoaded    = false;
let overlayOpenedAt = Infinity;
let peekActive      = false;
let overlayTimer    = null;

/* ── Firebase — watch for active group sessions ── */
firebase.initializeApp({
  apiKey:            'AIzaSyAdjm5xjfJLVLZQIvj0QlP6hOTMFpWfoIk',
  authDomain:        'resy-demo-b1955.firebaseapp.com',
  databaseURL:       'https://resy-demo-b1955-default-rtdb.firebaseio.com',
  projectId:         'resy-demo-b1955',
  storageBucket:     'resy-demo-b1955.firebasestorage.app',
  messagingSenderId: '506441695244',
  appId:             '1:506441695244:web:0279d894f0bbf282782e29',
});
const db = firebase.database();

db.ref('sessions').on('value', snap => {
  const sessions = snap.val();
  const panel    = document.getElementById('qr-panel');
  // Only react to sessions created AFTER the overlay was opened
  const freshSession = sessions
    ? Object.entries(sessions)
        .filter(([, v]) => (v.created || 0) >= overlayOpenedAt)
        .sort((a, b) => (b[1].created || 0) - (a[1].created || 0))[0]
    : null;
  const row = document.getElementById('demo-row');
  if (freshSession) {
    const [code] = freshSession;
    const joinUrl = `${RESY_URL}?group=${code}`;
    document.getElementById('qr-img').src =
      `https://api.qrserver.com/v1/create-qr-code/?size=328x328&data=${encodeURIComponent(joinUrl)}&color=1A1A1A&bgcolor=FFFFFF&margin=1`;
    document.getElementById('group-code').textContent = code;
    panel.classList.add('active');
    row.classList.add('qr-active');
  } else {
    panel.classList.remove('active');
    row.classList.remove('qr-active');
    document.getElementById('group-code').textContent = '';
  }
});

/* ── Phone scaling — symmetric margins keep the row vertically centered ── */
function scalePhone() {
  const wrap  = document.getElementById('phone-wrap');
  const scale = Math.min(1, (window.innerHeight * 0.82) / 844);
  const shrink = 844 * (1 - scale) / 2;
  wrap.style.transform    = `scale(${scale})`;
  wrap.style.marginTop    = `-${shrink}px`;
  wrap.style.marginBottom = `-${shrink}px`;
}
window.addEventListener('resize', scalePhone);
scalePhone();

/* ── Dots ── */
function buildDots() {
  const el = document.getElementById('dots');
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === DEMO_SLIDE ? ' demo-dot' : '');
    d.onclick = () => goTo(i);
    el.appendChild(d);
  });
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
  document.getElementById('counter').textContent = `${cur + 1} / ${SLIDES.length}`;
  document.getElementById('demo-hint').textContent = cur === DEMO_SLIDE ? '● Live Demo' : '';
}

/* ── Navigation ── */
function goTo(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;

  // Always clean up overlays before changing slide
  if (peekActive) hidePeek();
  if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
  if (overlayVisible && idx !== DEMO_SLIDE) hideOverlay();

  cur = idx;
  document.getElementById('slide-img').src = SLIDES[idx];
  updateDots();

  if (idx === DEMO_SLIDE && !overlayVisible) {
    overlayTimer = setTimeout(() => { overlayTimer = null; showOverlay(); }, 1800);
  }
}

function showPeek() {
  document.getElementById('peek-overlay').classList.add('active');
  document.getElementById('peek-video').play().catch(() => {});
  peekActive = true;
}

function hidePeek() {
  document.getElementById('peek-overlay').classList.remove('active');
  document.getElementById('peek-video').pause();
  peekActive = false;
}

function go(dir) {
  if (dir === 1 && cur === PEEK_SLIDE && !peekActive) { showPeek(); return; }
  if (peekActive) {
    hidePeek();
    setTimeout(() => goTo(cur + dir), 850);
    return;
  }
  goTo(cur + dir);
}

/* ── Overlay ── */
function showOverlay() {
  overlayOpenedAt = Date.now();
  // Start loading iframe immediately so it's ready
  if (!iframeLoaded) {
    document.getElementById('phone-iframe').src = RESY_URL;
    iframeLoaded = true;
  }
  // Reset splash state
  document.getElementById('phone-splash').classList.remove('hidden');
  document.getElementById('phone-iframe').style.opacity = '0';

  document.getElementById('resy-overlay').classList.add('visible');
  overlayVisible = true;

  // Blur establishes first (~1.1s), then phone fades in
  setTimeout(() => {
    document.getElementById('demo-row').classList.add('loaded');
    // After 2s of showing the splash, reveal the iframe
    setTimeout(() => {
      document.getElementById('phone-splash').classList.add('hidden');
      document.getElementById('phone-iframe').style.opacity = '1';
    }, 2000);
  }, 1400);
}

function hideOverlay() {
  document.getElementById('resy-overlay').classList.remove('visible');
  document.getElementById('demo-row').classList.remove('loaded');
  overlayVisible = false;
}

/* ── Fullscreen ── */
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fs-btn');
  btn.title       = document.fullscreenElement ? 'Exit fullscreen (F)' : 'Fullscreen (F)';
  btn.textContent = document.fullscreenElement ? '✕' : '⛶';
  scalePhone();
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    if (overlayVisible) hideOverlay();
    go(1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (overlayVisible) hideOverlay();
    go(-1);
  }
  if (e.key === 'Escape') { if (overlayVisible) hideOverlay(); if (peekActive) hidePeek(); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'd' || e.key === 'D') overlayVisible ? hideOverlay() : showOverlay();
});

buildDots();
updateDots();

if (PEEK_URL) {
  const vid = document.getElementById('peek-video');
  vid.src = PEEK_URL;
  vid.load();
}
</script>
</body>
</html>
