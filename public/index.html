const GROUP_VIBES=new Set(["casual","lively","sports bar","family-friendly","outdoor","festive","vibrant","buzzy","all-day","scenic","artsy","stylish"]);

function applyFilters(list,f){
  return list.filter(r=>{
    // Group size
    if(f.groupSize==="large"||f.groupSize==="party"){
      if(!r.good_for_groups)return false;
      // When no ambiance filter is explicitly set, exclude venues with no group-friendly vibe tags
      if(f.ambiance.length===0&&!r.ambiance.some(a=>GROUP_VIBES.has(a)))return false;
    }
    // Ambiance — OR logic (any selected tag matches)
    if(f.ambiance.length>0){if(!f.ambiance.some(a=>r.ambiance.includes(a)))return false;}
    // Cuisine — smarter matching
    if(f.cuisine&&f.cuisine!=="all"){
      const c=r.cuisine.toLowerCase();
      if(f.cuisine==="pizza"){if(!c.includes("pizza"))return false;}
      else if(f.cuisine==="italian"){if(!c.includes("italian")&&!c.includes("pizza"))return false;}
      else{if(!c.includes(f.cuisine.toLowerCase()))return false;}
    }
    if(f.price.length>0){if(!f.price.includes(r.price))return false;}
    // Dietary — AND logic (all selected must match)
    if(f.dietary.length>0){if(!f.dietary.every(d=>r.dietary.includes(d)))return false;}
    return true;
  });
}

/* ── SWIPE CARD ── */
function SwipeCard({r,stackIndex,onSwipe,triggerSwipe,onTime,amexLinked,groupVotes=0,memberCount=0}){
  const[dx,setDx]=useState(0);
  const[flyDir,setFlyDir]=useState(null);
  const dragging=useRef(false);
  const sx=useRef(0),sy=useRef(0),ldx=useRef(0),ldy=useRef(0);
  const isTop=stackIndex===0;
  const[flipped,setFlipped]=useState(false);
  const[flipping,setFlipping]=useState(false);

  const effectiveTimes=r.notifyOnly?(amexLinked?r.gdaTimes:[]):r.times;
  const isGDA=r.amexExclusive&&amexLinked;
  const isFullyBooked=r.notifyOnly&&!amexLinked;

  const[livePhotos,setLivePhotos]=useState([]);
  const[frontPhotoIdx,setFrontPhotoIdx]=useState(0);
  useEffect(()=>{
    if(stackIndex>1)return;
    window._placeCache=window._placeCache||{};
    const cached=window._placeCache[r.id];
    if(cached?.photos?.length>0){setLivePhotos(cached.photos.map(p=>`/api/place-photo?ref=${encodeURIComponent(p.ref)}`));return;}
    fetch(`/api/place-details?name=${encodeURIComponent(r.name)}`)
      .then(res=>res.ok?res.json():null)
      .then(d=>{if(d){window._placeCache[r.id]=d;if(d.photos?.length>0)setLivePhotos(d.photos.map(p=>`/api/place-photo?ref=${encodeURIComponent(p.ref)}`));} })
      .catch(()=>{});
  },[stackIndex,r.id,r.name]);

  const doSwipe=useCallback(dir=>{setFlyDir(dir);setTimeout(()=>onSwipe(dir,r),360);},[onSwipe,r]);
  useEffect(()=>{if(triggerSwipe&&isTop)doSwipe(triggerSwipe);},[triggerSwipe]);
  useEffect(()=>{setDx(0);setFlyDir(null);setFlipped(false);setFlipping(false);setFrontPhotoIdx(0);},[stackIndex]);

  const handleFlip=()=>{setFlipping(true);setTimeout(()=>{setFlipped(f=>!f);setFlipping(false);},150);};
  const flipBack=()=>{setFlipping(true);setTimeout(()=>{setFlipped(false);setFlipping(false);},150);};

  useEffect(()=>{
    if(!isTop)return;
    const mv=e=>{if(!dragging.current)return;const cx=e.touches?.[0]?.clientX??e.clientX;const cy=e.touches?.[0]?.clientY??e.clientY;ldx.current=cx-sx.current;ldy.current=cy-sy.current;setDx(ldx.current);};
    const up=()=>{if(!dragging.current)return;dragging.current=false;if(Math.abs(ldx.current)>75)doSwipe(ldx.current>0?"right":"left");else setDx(0);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    document.addEventListener("touchmove",mv,{passive:true});document.addEventListener("touchend",up);
    return()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);document.removeEventListener("touchmove",mv);document.removeEventListener("touchend",up);};
  },[isTop,doSwipe]);

  const onStart=e=>{
    if(!isTop||flyDir)return;dragging.current=true;ldx.current=0;
    sx.current=e.touches?.[0]?.clientX??e.clientX;sy.current=e.touches?.[0]?.clientY??e.clientY;
    e.preventDefault();
  };

  const SC=[1,0.956,0.915],YO=[0,14,26];
  const sc=SC[stackIndex]??0.88,yo=YO[stackIndex]??36;
  let tf,tr;
  if(flyDir==="right"){tf="translateX(115vw) rotate(22deg)";tr="transform 0.38s cubic-bezier(0.55,0,0.8,0.95)";}
  else if(flyDir==="left"){tf="translateX(-115vw) rotate(-22deg)";tr="transform 0.38s cubic-bezier(0.55,0,0.8,0.95)";}
  else if(isTop){tf=`translateX(${dx}px) translateY(${Math.abs(dx)*0.05}px) rotate(${dx*0.045}deg)`;tr=dragging.current?"none":"transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)";}
  else{tf=`translateY(${yo}px) scale(${sc})`;tr="transform 0.3s ease";}

  const likeOp=isTop?Math.min(Math.max(dx,0)/80,1):0;
  const nopeOp=isTop?Math.min(Math.max(-dx,0)/80,1):0;

  const ambianceBadge=r.ambiance[0];

  return(
    <div onMouseDown={onStart} onTouchStart={onStart}
      onClick={()=>{if(isTop&&Math.abs(ldx.current)<10&&Math.abs(ldy.current)<10&&!flyDir)handleFlip();}}
      style={{position:"absolute",inset:0,transform:tf,transition:tr,zIndex:30-stackIndex,
        cursor:isTop?(dragging.current?"grabbing":"grab"):"default",
        userSelect:"none",transformOrigin:"bottom center"}}>
      <div style={{borderRadius:18,overflow:"hidden",background:"#FFF",
        boxShadow:"0 6px 28px rgba(0,0,0,0.12),0 1px 6px rgba(0,0,0,0.05)",
        height:"100%",display:"flex",flexDirection:"column",
        transform:flipping?"scaleX(0.03)":"scaleX(1)",transition:"transform 0.14s ease"}}>
      {flipped
        ?<CardBack r={r} amexLinked={amexLinked} onFlipBack={flipBack} onSwipeRight={()=>{flipBack();setTimeout(()=>doSwipe("right"),160);}}/>
        :<>
        {/* Photo */}
        <div style={{flex:"0 0 68%",position:"relative",overflow:"hidden"}}>
          {livePhotos.length>0?<img src={livePhotos[frontPhotoIdx]} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={r.name}/>:<RestaurantImg r={r}/>}
          <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,rgba(0,0,0,0) 30%,rgba(0,0,0,0.72) 100%)"}}/>
          {/* Left/right photo tap zones + arrows */}
          {livePhotos.length>1&&<>
            <div onClick={e=>{e.stopPropagation();setFrontPhotoIdx(i=>(i-1+livePhotos.length)%livePhotos.length);}}
              style={{position:"absolute",left:0,top:0,bottom:0,width:"38%",zIndex:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-start",paddingLeft:8}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(0,0,0,0.32)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFF",fontSize:17,lineHeight:1,userSelect:"none"}}>‹</div>
            </div>
            <div onClick={e=>{e.stopPropagation();setFrontPhotoIdx(i=>(i+1)%livePhotos.length);}}
              style={{position:"absolute",right:0,top:0,bottom:0,width:"38%",zIndex:5,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:8}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(0,0,0,0.32)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",color:"#FFF",fontSize:17,lineHeight:1,userSelect:"none"}}>›</div>
            </div>
            <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",display:"flex",gap:3,zIndex:6}}>
              {livePhotos.slice(0,8).map((_,i)=>(
                <div key={i} style={{width:i===frontPhotoIdx?18:5,height:4,borderRadius:2,background:i===frontPhotoIdx?"#FFF":"rgba(255,255,255,0.45)",transition:"width 0.2s"}}/>
              ))}
            </div>
          </>}

          {/* Badges */}
          <div style={{position:"absolute",top:14,left:14,display:"flex",gap:6}}>
            {isGDA&&<div style={{background:"#FF4438",borderRadius:6,padding:"3px 9px"}}><span style={{color:"#FFF",fontSize:9,fontWeight:800,letterSpacing:"0.8px"}}>AMEX GDA ★</span></div>}
            {r.rating>=4.5&&<div style={{background:"rgba(255,255,255,0.18)",backdropFilter:"blur(8px)",borderRadius:6,padding:"3px 9px",border:"1px solid rgba(255,255,255,0.2)"}}><span style={{color:"#FFF",fontSize:9,fontWeight:700,letterSpacing:"0.4px"}}>⭑ TOP RATED</span></div>}
            {groupVotes>0&&<div style={{background:"rgba(34,197,94,0.88)",backdropFilter:"blur(6px)",borderRadius:6,padding:"3px 9px",border:"1px solid rgba(255,255,255,0.2)"}}><span style={{color:"#FFF",fontSize:9,fontWeight:800,letterSpacing:"0.4px"}}>👥 {groupVotes}/{memberCount} want this</span></div>}
          </div>
          {ambianceBadge&&<div style={{position:"absolute",top:14,right:14,background:"rgba(0,0,0,0.36)",backdropFilter:"blur(8px)",borderRadius:6,padding:"3px 9px",border:"1px solid rgba(255,255,255,0.12)"}}>
            <span style={{color:"#FFF",fontSize:9,fontWeight:600,textTransform:"capitalize",letterSpacing:"0.3px"}}>{ambianceBadge}</span>
          </div>}

          {/* SAVE / PASS stamps */}
          <div style={{position:"absolute",top:20,left:16,opacity:likeOp,border:"3px solid #22C55E",borderRadius:9,padding:"4px 12px",color:"#22C55E",fontWeight:900,fontSize:20,letterSpacing:2,transform:"rotate(-14deg)"}}>
            {isFullyBooked?"NOTIFY":"DINE!"}
          </div>
          <div style={{position:"absolute",top:20,right:16,opacity:nopeOp,border:"3px solid #FF4438",borderRadius:9,padding:"4px 12px",color:"#FF4438",fontWeight:900,fontSize:20,letterSpacing:2,transform:"rotate(14deg)"}}>PASS</div>
          <div style={{position:"absolute",inset:0,background:"rgba(34,197,94,0.14)",opacity:likeOp,pointerEvents:"none"}}/>
          <div style={{position:"absolute",inset:0,background:"rgba(255,68,56,0.14)",opacity:nopeOp,pointerEvents:"none"}}/>

          {/* Name overlay */}
          <div style={{position:"absolute",bottom:14,left:16,right:16}}>
            <h2 style={{color:"#FFF",fontSize:22,fontWeight:800,margin:0,letterSpacing:"-0.4px",textShadow:"0 1px 8px rgba(0,0,0,0.3)"}}>{r.name}</h2>
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
              <span style={{color:"rgba(255,255,255,0.78)",fontSize:12,fontWeight:500}}>{r.hood}</span>
              <span style={{color:"rgba(255,255,255,0.4)",fontSize:10}}>·</span>
              <span style={{color:"rgba(255,255,255,0.78)",fontSize:12,fontWeight:500}}>{r.cuisine}</span>
            </div>
          </div>
        </div>

        {/* Info panel — compact */}
        <div style={{flex:1,padding:"10px 14px 10px",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          {/* Meta row */}
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <Stars n={r.rating}/>
            <span style={{color:"#DDDDDD"}}>·</span>
            <span style={{color:"#555",fontSize:12,fontWeight:600}}>{r.price}</span>
            <span style={{color:"#DDDDDD"}}>·</span>
            <span style={{fontSize:12,color:"#999"}}>{r.dist}</span>
            {r.good_for_groups&&<>
              <span style={{color:"#DDDDDD"}}>·</span>
              <span style={{display:"flex",alignItems:"center",gap:2,fontSize:11,color:"#AAAAAA"}}>
                <Svg d={I.users} size={10} stroke="#BBBBBB"/>Groups OK
              </span>
            </>}
          </div>

          {/* Times / Notify */}
          {isFullyBooked?(
            <div>
              <p style={{fontSize:11,color:"#C0C0C0",margin:"0 0 7px"}}>Fully booked tonight</p>
              {isTop&&(
                <button onClick={e=>{e.stopPropagation();onSwipe&&onSwipe("notify",r);}}
                  style={{width:"100%",padding:"8px",borderRadius:9,background:"#FF4438",border:"none",color:"#FFF",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                  Notify Me
                </button>
              )}
            </div>
          ):(
            <div>
              <p style={{fontSize:"9px",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#BBBBBB",margin:"0 0 6px"}}>
                {isGDA?"GDA Exclusive · Amex Platinum Only":"Available Tonight"}
              </p>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {effectiveTimes.map(t=><TimePill key={t} t={t} onSelect={isTop?t=>onTime&&onTime(t):null}/>)}
              </div>
            </div>
          )}
        </div>
        </>}
      </div>
    </div>
  );
}

  const toggleArr=(key,val)=>setF(p=>({...p,[key]:p[key].includes(val)?p[key].filter(x=>x!==val):[...p[key],val]}));
  const set=(key,val)=>setF(p=>({...p,[key]:p[key]===val?null:val}));

  const Section=({label,children})=>(
    <div style={{marginBottom:20}}>
      <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.3px",color:"#AAAAAA",margin:"0 0 10px"}}>{label}</p>

          <Section label="Price">

                <div><p style={{fontSize:14,fontWeight:700,color:"#1A1A1A",margin:"0 0 2px"}}>{opt.label}</p><p style={{fontSize:11,color:"#999",margin:0}}>{opt.sub}</p></div>

    </div>
  );
}

/* ── GROUP OVERLAY — real-time session ── */
function GroupOverlay({onClose,onSessionStart}){
  const[phase,setPhase]=useState("start");
  const[code,setCode]=useState(null);
  const[members,setMembers]=useState({});
  const[creating,setCreating]=useState(false);
  const[joinInput,setJoinInput]=useState("");
  const[joinError,setJoinError]=useState(false);
  const[userName,setUserName]=useState("");
  const myId=useRef(getUID()).current;
  const dbRef=useRef(null);
  const isFirebase=!!window.resyDB;

  const displayName=userName.trim()||"Guest";

  const createSession=async()=>{
    setCreating(true);
    const c=genGroupCode();
    setCode(c);
    if(isFirebase){
      const ref=window.resyDB.ref(`sessions/${c}`);
      await ref.set({created:Date.now(),members:{[myId]:{joined:Date.now(),name:displayName}},swipes:{[myId]:{}}});
      dbRef.current=ref;
      ref.child("members").on("value",snap=>{if(snap.exists())setMembers(snap.val());});
    } else {
      setMembers({[myId]:{joined:Date.now(),name:displayName}});
    }
    setCreating(false);
    setPhase("waiting");
  };

  const startSwiping=()=>{
    if(dbRef.current) dbRef.current.child("members").off();
    onSessionStart({code,myId,dbRef:dbRef.current,name:displayName});
    onClose();
  };

  const joinByCode=()=>{
    const raw=joinInput.trim().toUpperCase();
    const c=raw.startsWith("RESY-")?raw:`RESY-${raw}`;
    if(c.length<7){setJoinError(true);return;}
    setJoinError(false);
    onSessionStart({code:c,myId,dbRef:null,name:displayName});
    onClose();
  };

  useEffect(()=>()=>{if(dbRef.current)dbRef.current.child("members").off();},[]);

  const memberCount=Object.keys(members).length;
  const groupUrl=`${window.location.origin}${window.location.pathname}?group=${code}`;
  const qrSrc=code?`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(groupUrl)}&color=1A1A1A&bgcolor=FFFFFF`:null;

  return(
    <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.46)",display:"flex",flexDirection:"column",justifyContent:"flex-end",zIndex:110}} onClick={onClose}>
      <div className="slide-up" style={{background:"#FFF",borderRadius:"22px 22px 0 0",padding:"22px 20px 40px"}} onClick={e=>e.stopPropagation()}>
        <div style={{width:36,height:4,background:"#E8E8E8",borderRadius:2,margin:"0 auto 18px"}}/>

        {phase==="start"&&<>
          <h2 style={{fontSize:20,fontWeight:800,color:"#1A1A1A",margin:"0 0 8px"}}>Group Mode</h2>
          <p style={{color:"#999",fontSize:13,lineHeight:1.6,margin:"0 0 6px"}}>
            Everyone swipes independently. Tap <strong style={{color:"#FF4438"}}>Results</strong> anytime to see the live vote leaderboard and book the group's top pick.
          </p>
          {!isFirebase&&<p style={{fontSize:11,color:"#BBBBBB",margin:"0 0 6px",textAlign:"center"}}>Works across browser tabs · deploys to full multi-device with Firebase</p>}
          <div style={{height:10}}/>
          {/* Name input */}
          <input
            value={userName}
            onChange={e=>setUserName(e.target.value)}
            placeholder="Your name (e.g. Sagar)"
            maxLength={24}
            style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1.5px solid #EEEEEE",fontSize:14,color:"#1A1A1A",outline:"none",background:"#FAFAFA",boxSizing:"border-box",marginBottom:12}}
          />
          <button onClick={createSession} disabled={creating} style={{width:"100%",padding:15,borderRadius:12,background:"#FF4438",border:"none",color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {creating&&<div className="spinner"/>}
            {creating?"Creating session…":"Create Group Session"}
          </button>

          {/* Divider */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <div style={{flex:1,height:1,background:"#EEEEEE"}}/>
            <span style={{fontSize:11,color:"#CCCCCC",fontWeight:600,letterSpacing:"0.5px"}}>OR JOIN EXISTING</span>
            <div style={{flex:1,height:1,background:"#EEEEEE"}}/>
          </div>

          {/* Join by code input */}
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input
              value={joinInput}
              onChange={e=>{setJoinInput(e.target.value.toUpperCase());setJoinError(false);}}
              onKeyDown={e=>e.key==="Enter"&&joinByCode()}
              placeholder="Enter code — e.g. RESY-4A8C"
              maxLength={12}
              style={{flex:1,padding:"12px 14px",borderRadius:10,border:`1.5px solid ${joinError?"#FF4438":"#EEEEEE"}`,fontSize:14,fontWeight:600,letterSpacing:"1px",color:"#1A1A1A",outline:"none",background:"#FAFAFA"}}
            />
            <button onClick={joinByCode} style={{padding:"12px 16px",borderRadius:10,background:"#1A1A1A",border:"none",color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer",flexShrink:0}}>
              Join
            </button>
          </div>
          {joinError&&<p style={{fontSize:11,color:"#FF4438",margin:"0 0 10px",textAlign:"center"}}>Enter a valid code (e.g. RESY-4A8C)</p>}

          <button onClick={onClose} style={{width:"100%",padding:12,borderRadius:12,background:"#FFF",border:"1.5px solid #EEEEEE",color:"#777",fontSize:14,cursor:"pointer"}}>Cancel</button>
        </>}

        {phase==="waiting"&&code&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h2 style={{fontSize:18,fontWeight:800,color:"#1A1A1A",margin:0}}>Share & Join</h2>
            <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",padding:4}}><Svg d={I.x} size={18} stroke="#AAAAAA"/></button>
          </div>

          {/* QR + code */}
          <div style={{display:"flex",gap:14,marginBottom:14,alignItems:"center"}}>
            <div style={{background:"#F7F5F0",borderRadius:14,padding:11,flexShrink:0}}>
              {qrSrc
                ?<img src={qrSrc} width={108} height={108} style={{display:"block",borderRadius:6}} alt="Group QR"/>
                :<div style={{width:108,height:108,background:"#E5E5E5",borderRadius:6}}/>}
            </div>
            <div style={{flex:1}}>
              <p style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.2px",color:"#AAAAAA",margin:"0 0 5px"}}>Session Code</p>
              <div style={{fontSize:24,fontWeight:900,color:"#FF4438",letterSpacing:3,lineHeight:1}}>{code}</div>
              <p style={{fontSize:11,color:"#AAAAAA",margin:"6px 0 10px",lineHeight:1.5}}>Scan the QR or share the code</p>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:memberCount>1?"#22C55E":"#FF9500",flexShrink:0,
                  boxShadow:memberCount>1?"0 0 0 3px rgba(34,197,94,0.2)":"0 0 0 3px rgba(255,149,0,0.2)"}}/>
                <span style={{fontSize:12,fontWeight:700,color:memberCount>1?"#22C55E":"#FF9500"}}>
                  {memberCount} {memberCount===1?"member — waiting":"members ready"}
                </span>
              </div>
            </div>
          </div>

          {/* Live member avatars */}
          <div style={{background:"#F7F5F0",borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",minHeight:50}}>
            {Object.entries(members).map(([uid,m],i)=>(
              <div key={uid} style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:uid===myId?"#FF4438":"#1C1C1E",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:"0 2px 6px rgba(0,0,0,0.14)"}}>
                  <span style={{color:"#FFF",fontSize:11,fontWeight:800}}>{(m.name||"?")[0].toUpperCase()}</span>
                </div>
                <span style={{fontSize:12,fontWeight:uid===myId?700:500,color:uid===myId?"#FF4438":"#555"}}>
                  {uid===myId?`${m.name||"You"} (you)`:m.name||`Guest ${i+1}`}
                </span>
              </div>
            ))}
            <span style={{fontSize:11,color:"#BBBBBB",marginLeft:"auto"}}>{isFirebase?"Live":"Local"}</span>
          </div>

          <button onClick={startSwiping} style={{width:"100%",padding:14,borderRadius:12,background:"#FF4438",border:"none",color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer"}}>
            Start Swiping · {memberCount} {memberCount===1?"Person":"People"}
          </button>
        </>}
      </div>
    </div>
  );
}

/* ── GROUP RESULTS OVERLAY ── */
function GroupResultsOverlay({ranked,memberCount,groupMembers,groupSwipes,groupTimes,onBook,onClose}){
  const medals=["🥇","🥈","🥉"];
  const[expandedId,setExpandedId]=useState(null);

  const getVoters=(r)=>Object.entries(groupMembers)
    .filter(([uid])=>groupSwipes[uid]?.[r.id]==="right")
    .map(([uid,m])=>({name:m.name||"Guest",time:groupTimes[uid]?.[r.id]||null}));

  const topTime=(voters)=>{
    const freq={};
    voters.forEach(v=>{if(v.time)freq[v.time]=(freq[v.time]||0)+1;});
    return Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  };
  return(
    <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.55)",zIndex:115,display:"flex",flexDirection:"column",justifyContent:"flex-end"}} onClick={onClose}>
      <div className="slide-up" style={{background:"#FFF",borderRadius:"22px 22px 0 0",maxHeight:"84vh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{padding:"16px 20px 10px",borderBottom:"1px solid #F0F0F0",flexShrink:0}}>
          <div style={{width:36,height:4,background:"#E0E0E0",borderRadius:2,margin:"0 auto 14px"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <p style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.3px",color:"#AAAAAA",margin:"0 0 3px"}}>Group Results · {memberCount} voters</p>
              <h2 style={{fontSize:19,fontWeight:800,color:"#1A1A1A",margin:0,letterSpacing:"-0.4px"}}>
                {ranked.length>0?"The Group Has Spoken 🗳️":"No votes yet"}
              </h2>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",padding:4,marginTop:2}}>
              <Svg d={I.x} size={18} stroke="#BBBBBB"/>
            </button>
          </div>
        </div>

        {/* Rankings list */}
        <div style={{flex:1,overflowY:"auto",padding:"8px 20px 12px"}}>
          {ranked.length===0&&(
            <div style={{textAlign:"center",padding:"40px 0"}}>
              <div style={{fontSize:32,marginBottom:10}}>🗳️</div>
              <p style={{color:"#AAAAAA",fontSize:14}}>No right swipes yet — keep going!</p>
            </div>
          )}
          {ranked.map((r,i)=>{
            const pct=memberCount>0?Math.round((r.votes/memberCount)*100):0;
            const isWinner=i===0;
            const isExpanded=expandedId===r.id;
            const voters=getVoters(r);
            const best=topTime(voters);
            return(
              <div key={r.id} style={{borderBottom:"1px solid #F7F7F7"}}>
                {/* Main row */}
                <div style={{display:"flex",gap:11,padding:"11px 0",alignItems:"center",cursor:"pointer"}} onClick={()=>setExpandedId(isExpanded?null:r.id)}>
                  {/* Rank */}
                  <div style={{width:28,textAlign:"center",flexShrink:0}}>
                    {medals[i]?<span style={{fontSize:20}}>{medals[i]}</span>:<span style={{fontSize:13,fontWeight:700,color:"#CCCCCC"}}>{i+1}</span>}
                  </div>
                  {/* Photo */}
                  <div style={{width:52,height:52,borderRadius:10,overflow:"hidden",flexShrink:0,
                    boxShadow:isWinner?"0 3px 12px rgba(255,68,56,0.22)":"none",
                    border:isWinner?"1.5px solid #FF4438":"1px solid #F0F0F0"}}>
                    <RestaurantImg r={r}/>
                  </div>
                  {/* Info + bar */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:2}}>
                      <p style={{fontSize:13,fontWeight:isWinner?800:600,color:isWinner?"#1A1A1A":"#333",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:6}}>{r.name}</p>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                        <span style={{fontSize:13,fontWeight:800,color:isWinner?"#FF4438":"#AAAAAA"}}>{r.votes}/{memberCount}</span>
                        <span style={{fontSize:10,color:"#CCCCCC"}}>{isExpanded?"▲":"▼"}</span>
                      </div>
                    </div>
                    <p style={{fontSize:10,color:"#BBBBBB",margin:"0 0 5px"}}>{r.cuisine} · {r.hood}</p>
                    <div style={{height:5,background:"#F2F2F2",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:isWinner?"#FF4438":i===1?"#FF9500":i===2?"#FFD700":"#E0E0E0",borderRadius:3,transition:"width 0.5s cubic-bezier(0.175,0.885,0.32,1.275)"}}/>
                    </div>
                    {best&&<p style={{fontSize:9,color:"#22C55E",margin:"3px 0 0",fontWeight:700}}>Best time: {best}</p>}
                  </div>
                </div>
                {/* Expanded voter list */}
                {isExpanded&&(
                  <div style={{background:"#F9F9F9",borderRadius:10,padding:"10px 12px",marginBottom:10}}>
                    {voters.length===0
                      ?<p style={{fontSize:12,color:"#BBBBBB",margin:0,textAlign:"center"}}>No right swipes yet</p>
                      :voters.map((v,vi)=>(
                        <div key={vi} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:vi<voters.length-1?"1px solid #F0F0F0":"none"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7}}>
                            <div style={{width:24,height:24,borderRadius:"50%",background:"#FF4438",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                              <span style={{color:"#FFF",fontSize:10,fontWeight:800}}>{v.name[0].toUpperCase()}</span>
                            </div>
                            <span style={{fontSize:12,fontWeight:600,color:"#333"}}>{v.name}</span>
                          </div>
                          <span style={{fontSize:11,color:v.time?"#22C55E":"#CCCCCC",fontWeight:v.time?700:400}}>
                            {v.time||"No preference"}
                          </span>
                        </div>
                      ))
                    }
                    {best&&<div style={{marginTop:8,padding:"6px 10px",background:"rgba(34,197,94,0.08)",borderRadius:7,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:10,fontWeight:700,color:"#16A34A"}}>Most popular time</span>
                      <span style={{fontSize:12,fontWeight:800,color:"#16A34A"}}>{best}</span>
                    </div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* CTAs */}
        <div style={{padding:"12px 20px 36px",borderTop:"1px solid #F0F0F0",flexShrink:0}}>
          {ranked.length>0?(
            <>
              <button onClick={()=>onBook(ranked[0])} style={{width:"100%",padding:14,borderRadius:12,background:"#FF4438",border:"none",color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                <span>{medals[0]}</span>Reserve {ranked[0].name}
              </button>
              <button onClick={onClose} style={{width:"100%",padding:12,borderRadius:12,background:"#FFF",border:"1.5px solid #EEEEEE",color:"#777",fontSize:14,cursor:"pointer"}}>
                Keep Swiping
              </button>
            </>
          ):(
            <button onClick={onClose} style={{width:"100%",padding:14,borderRadius:12,background:"#FF4438",border:"none",color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer"}}>
              Back to Swiping
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

      <div style={{padding:"14px 22px 36px",borderTop:"1px solid #F0F0F0",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
        <button onClick={onViewReservations} style={{width:"100%",padding:15,borderRadius:12,background:"#FF4438",border:"none",color:"#FFF",fontSize:15,fontWeight:700,cursor:"pointer"}}>View My Reservations</button>
        <button onClick={onKeepBrowsing} style={{width:"100%",padding:13,borderRadius:12,background:"#FFF",border:"1.5px solid #EEEEEE",color:"#1A1A1A",fontSize:14,fontWeight:600,cursor:"pointer"}}>Keep Discovering</button>
      </div>
    </div>
  );
}

/* ── MATCH / BOOKING SCREEN ── */
function MatchScreen({r,time,amexLinked,onBack,onBookingConfirmed,goToReservations}){
  const[vis,setVis]=useState(false);
  const[party,setParty]=useState(2);
  const[occasion,setOccasion]=useState(null);
  const[note,setNote]=useState("");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState("");
  const[confirmed,setConfirmed]=useState(null);
  useEffect(()=>{setTimeout(()=>setVis(true),40);},[]);

  const bookingDate=useMemo(()=>new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}),[]);
  const validEmail=/^\S+@\S+\.\S+$/.test(email);
  const canConfirm=name.trim()&&validEmail&&!loading;

  const handleConfirm=async()=>{
    if(!canConfirm)return;
    setError("");setLoading(true);
    const code="RSY"+Math.floor(100000+Math.random()*900000);
    try{
      const isServer=window.location.hostname==="localhost"&&window.location.port==="3000";
      if(isServer){
        const res=await fetch("/api/send-reservation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.trim(),email,restaurant:r.name,cuisine:r.cuisine,hood:r.hood,date:bookingDate,time,guests:party,occasion:occasion||null,note:note.trim()||null,amexLinked})});
        const data=await res.json();
        if(!res.ok)throw new Error(data.detail||data.error||"Server error");
      } else {
        if(window.EMAILJS_PUBLIC_KEY==="YOUR_PUBLIC_KEY")throw new Error("EmailJS not configured — replace the placeholder keys at the top of this file.");
        await emailjs.send(window.EMAILJS_SERVICE_ID,window.EMAILJS_TEMPLATE_ID,{
          to_name:name.trim(),to_email:email,
          restaurant:r.name,cuisine:r.cuisine,hood:r.hood,
          date:bookingDate,time,guests:`${party} ${party===1?"guest":"guests"}`,
          occasion:occasion||"—",note:note.trim()||"—",
          amex_credit:amexLinked?"★ Amex Platinum · $100 Resy Credit Applied Automatically":"",
          confirmation_code:code,
        });
      }
      onBookingConfirmed&&onBookingConfirmed({r,time,party,occasion,code,date:bookingDate});
      setConfirmed({code,email});
    }catch(err){
      const detail=err?.text||err?.message||JSON.stringify(err);
      setError("Could not send confirmation: "+detail);
    }finally{setLoading(false);}
  };

  if(confirmed)return<ConfirmationOverlay r={r} code={confirmed.code} userEmail={confirmed.email} time={time} party={party} occasion={occasion} amexLinked={amexLinked} onViewReservations={goToReservations} onKeepBrowsing={onBack}/>;

  return(
    <div style={{position:"absolute",inset:0,background:"#FFF",zIndex:80,display:"flex",flexDirection:"column"}}>
      <div style={{flex:1,overflowY:"auto",padding:"50px 20px 22px",opacity:vis?1:0,transform:vis?"none":"translateY(14px)",transition:"all 0.4s cubic-bezier(0.175,0.885,0.32,1.275)"}}>
        {amexLinked&&<div style={{background:"#FFF5F4",border:"1px solid #FFD0CC",borderRadius:10,padding:"10px 14px",marginBottom:18,display:"flex",alignItems:"center",gap:9}}>
          <Svg d={I.star} size={14} stroke="#FF4438" fill="#FF4438" sw={0}/>
          <div>
            <p style={{fontSize:12,fontWeight:700,color:"#FF4438",margin:"0 0 1px"}}>$100 Resy Credit · Eligible</p>
            <p style={{fontSize:11,color:"#AAAAAA",margin:0}}>Amex Platinum quarterly dining credit applies automatically</p>
          </div>
        </div>}
        <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1.5px",color:"#FF4438",margin:"0 0 5px"}}>Confirm Reservation</p>
        <h1 style={{fontSize:26,fontWeight:800,color:"#1A1A1A",letterSpacing:"-0.8px",margin:"0 0 3px"}}>{r.name}</h1>
        <p style={{color:"#999",fontSize:13,margin:"0 0 16px"}}>{r.cuisine} · {r.hood}</p>
        <div style={{borderRadius:14,overflow:"hidden",height:150,marginBottom:16}}>
          <RestaurantImg r={r}/>
        </div>
        <div style={{background:"#F7F5F0",borderRadius:13,padding:16,marginBottom:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            {[["DATE",bookingDate],["TIME",time||r.times[0]||r.gdaTimes[0]]].map(([l,v])=>(
              <div key={l}><p style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#AAAAAA",margin:"0 0 4px"}}>{l}</p><p style={{fontSize:14,fontWeight:700,color:"#1A1A1A",margin:0}}>{v}</p></div>
            ))}
          </div>
          <p style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#AAAAAA",margin:"0 0 9px"}}>Party Size</p>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={()=>setParty(p=>Math.max(1,p-1))} style={{width:32,height:32,borderRadius:"50%",border:"1.5px solid #E8E8E8",background:"#FFF",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Svg d={I.minus} size={14} stroke="#1A1A1A" sw={2}/></button>
            <span style={{fontSize:17,fontWeight:700,color:"#1A1A1A",minWidth:24,textAlign:"center"}}>{party}</span>
            <button onClick={()=>setParty(p=>Math.min(20,p+1))} style={{width:32,height:32,borderRadius:"50%",border:"1.5px solid #E8E8E8",background:"#FFF",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Svg d={I.plus} size={14} stroke="#1A1A1A" sw={2}/></button>
            <span style={{fontSize:13,color:"#AAAAAA",marginLeft:4}}>{party===1?"guest":"guests"}</span>
          </div>
        </div>
        <div style={{marginBottom:14}}>
          <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#AAAAAA",margin:"0 0 10px"}}>Occasion (optional)</p>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            {["Birthday","Anniversary","Business","Celebration","Date Night","Just Dinner"].map(o=>(
              <Pill key={o} label={o} active={occasion===o} onClick={()=>setOccasion(occasion===o?null:o)} sm/>
            ))}
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#AAAAAA",margin:"0 0 8px"}}>Note to restaurant (optional)</p>
          <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Dietary restrictions, seating preferences, celebrations..." rows={2}
            style={{width:"100%",padding:"11px 13px",borderRadius:10,border:"1.5px solid #EEEEEE",background:"#FAFAFA",fontSize:13,color:"#1A1A1A",lineHeight:1.55,boxSizing:"border-box"}}/>
        </div>
        <div style={{borderTop:"1px solid #F0F0F0",paddingTop:16,display:"flex",flexDirection:"column",gap:11}}>
          <p style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",color:"#AAAAAA",margin:0}}>Your Details · Confirmation Email</p>
          <Field label="Full Name" value={name} onChange={setName} placeholder="Jane Doe" icon="user"/>
          <Field label="Email Address" value={email} onChange={setEmail} type="email" placeholder="jane@example.com" icon="mail"/>
        </div>
        {error&&<div style={{marginTop:12,padding:"11px 14px",borderRadius:10,background:"#FFF0EE",border:"1px solid #FFD0CC"}}>
          <p style={{fontSize:12,color:"#CC2200",margin:0}}>{error}</p>
        </div>}
      </div>
      <div style={{padding:"13px 20px 34px",borderTop:"1px solid #F0F0F0",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
        <button onClick={handleConfirm} disabled={!canConfirm}
          style={{width:"100%",padding:15,borderRadius:12,background:canConfirm?"#FF4438":"#F0F0F0",border:"none",color:canConfirm?"#FFF":"#BBBBB",fontSize:15,fontWeight:700,cursor:canConfirm?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all 0.2s"}}>
          {loading&&<div className="spinner"/>}
          {loading?"Sending confirmation…":"Confirm Reservation"}
        </button>
        <button onClick={onBack} style={{width:"100%",padding:13,borderRadius:12,background:"#FFF",border:"1.5px solid #EEEEEE",color:"#1A1A1A",fontSize:14,fontWeight:600,cursor:"pointer"}}>Keep Browsing</button>
      </div>
    </div>
  );
}

/* ── DISCOVER SCREEN ── */
function DiscoverScreen({onBookingConfirmed,goToReservations,onGroupSession}){
  const[showOnboard,setShowOnboard]=useState(true);
  const[prefs,setPrefs]=useState(null);
  const[filters,setFilters]=useState(DEFAULT_FILTERS);
  const[showFilter,setShowFilter]=useState(false);
  const[idx,setIdx]=useState(0);
  const[match,setMatch]=useState(null);
  const[matchTime,setMatchTime]=useState(null);
  const[showGroup,setShowGroup]=useState(false);
  const[showAmexPromo,setShowAmexPromo]=useState(false);
  const[trigger,setTrigger]=useState(null);
  const[notifyR,setNotifyR]=useState(null);

  // ── Group session state ──
  const[groupSession,setGroupSession]=useState(null); // {code, myId}
  const[groupMembers,setGroupMembers]=useState({});   // {uid: {joined}}
  const[groupSwipes,setGroupSwipes]=useState({});     // {uid: {restaurantId: "right"|"left"}}
  const[joinPrompt,setJoinPrompt]=useState(null);     // group code from URL ?group=
  const[showGroupResults,setShowGroupResults]=useState(false);
  const[groupTimes,setGroupTimes]=useState({});  // {uid:{rId:"7:00 PM"}}
  const[pendingTimeR,setPendingTimeR]=useState(null); // restaurant awaiting time pick
  const[joinName,setJoinName]=useState("");
  const groupDBRef=useRef(null);
  const storageLstnRef=useRef(null); // localStorage storage-event listener
  const myUID=useRef(getUID()).current;

  // Attach a storage-event listener that keeps group state live across tabs
  const attachStorageListener=useCallback((code)=>{
    if(storageLstnRef.current) window.removeEventListener("storage",storageLstnRef.current);
    const fn=(e)=>{
      if(e.key!==`resy-session-${code}`)return;
      try{
        const d=JSON.parse(e.newValue||"{}");
        if(d.members) setGroupMembers(d.members);
        if(d.swipes)  setGroupSwipes(d.swipes);
        if(d.times)   setGroupTimes(d.times);
      }catch(_){}
    };
    storageLstnRef.current=fn;
    window.addEventListener("storage",fn);
  },[]);

  const amexLinked=prefs?.amexTier==="platinum";
  const filtered=useMemo(()=>applyFilters(RESTAURANTS,filters),[filters]);
  const visible=filtered.slice(idx,idx+3);
  const remaining=filtered.length-idx;

  const activeFilterCount=useMemo(()=>{
    let c=0;
    if(filters.groupSize)c++;
    c+=filters.ambiance.length;
    if(filters.cuisine&&filters.cuisine!=="all")c++;
    c+=filters.price.length;
    c+=filters.dietary.length;
    return c;
  },[filters]);

  // Reset idx when filters change
  useEffect(()=>setIdx(0),[filters]);

  // URL param: auto-prompt join when ?group=CODE is present
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const gc=p.get("group");
    if(gc) setJoinPrompt(gc);
  },[]);

  // Compute vote counts per restaurant from all members' right swipes
  const groupVotes=useMemo(()=>{
    const counts={};
    RESTAURANTS.forEach(r=>{counts[r.id]=0;});
    Object.values(groupSwipes).forEach(memberSwipes=>{
      Object.entries(memberSwipes||{}).forEach(([rid,dir])=>{
        if(dir==="right") counts[parseInt(rid)]=(counts[parseInt(rid)]||0)+1;
      });
    });
    return counts;
  },[groupSwipes]);

  const sortedByVotes=useMemo(()=>{
    return [...RESTAURANTS]
      .map(r=>({...r,votes:groupVotes[r.id]||0}))
      .filter(r=>r.votes>0)
      .sort((a,b)=>b.votes-a.votes);
  },[groupVotes]);

  const topPick=sortedByVotes[0]||null;

  const handleSessionStart=useCallback(({code,myId,dbRef,name})=>{
    const displayName=name||"Guest";
    const initialMembers={[myId]:{joined:Date.now(),name:displayName}};
    setGroupSession({code,myId});
    setGroupMembers(initialMembers);
    onGroupSession&&onGroupSession(code);
    if(dbRef){
      // Firebase path
      groupDBRef.current=dbRef;
      dbRef.child("members").on("value",snap=>{if(snap.exists())setGroupMembers(snap.val());});
      dbRef.child("swipes").on("value",snap=>{if(snap.exists())setGroupSwipes(snap.val());});
      dbRef.child("times").on("value",snap=>{if(snap.exists())setGroupTimes(snap.val());});
    } else {
      // localStorage path — write initial state so other tabs can read it
      localStorage.setItem(`resy-session-${code}`,JSON.stringify({
        created:Date.now(),members:initialMembers,swipes:{[myId]:{}},times:{}
      }));
      attachStorageListener(code);
    }
  },[attachStorageListener,onGroupSession]);

  const joinGroup=useCallback(async(code,name)=>{
    setJoinPrompt(null);
    const displayName=name||"Guest";
    if(window.resyDB){
      // Firebase path
      const ref=window.resyDB.ref(`sessions/${code}`);
      const snap=await ref.once("value");
      if(!snap.exists())return;
      await ref.child(`members/${myUID}`).set({joined:Date.now(),name:displayName});
      await ref.child(`swipes/${myUID}`).set({});
      groupDBRef.current=ref;
      setGroupSession({code,myId:myUID});
      onGroupSession&&onGroupSession(code);
      ref.child("members").on("value",s=>{if(s.exists())setGroupMembers(s.val());});
      ref.child("swipes").on("value",s=>{if(s.exists())setGroupSwipes(s.val());});
      ref.child("times").on("value",s=>{if(s.exists())setGroupTimes(s.val());});
    } else {
      // localStorage path
      const key=`resy-session-${code}`;
      let session;
      try{ session=JSON.parse(localStorage.getItem(key)||"{}"); }catch(_){ session={}; }
      if(!session.created){
        session={created:Date.now(),members:{},swipes:{},times:{}};
      }
      const members={...session.members,[myUID]:{joined:Date.now(),name:displayName}};
      const swipes={...session.swipes,[myUID]:session.swipes?.[myUID]||{}};
      localStorage.setItem(key,JSON.stringify({...session,members,swipes}));
      setGroupSession({code,myId:myUID});
      onGroupSession&&onGroupSession(code);
      setGroupMembers(members);
      setGroupSwipes(swipes);
      attachStorageListener(code);
    }
  },[myUID,attachStorageListener,onGroupSession]);

  const leaveGroup=useCallback(()=>{
    if(groupDBRef.current){groupDBRef.current.child("members").off();groupDBRef.current.child("swipes").off();}
    groupDBRef.current=null;
    if(storageLstnRef.current){window.removeEventListener("storage",storageLstnRef.current);storageLstnRef.current=null;}
    setGroupSession(null);setGroupMembers({});setGroupSwipes({});setGroupTimes({});
    setShowGroupResults(false);setPendingTimeR(null);
    onGroupSession&&onGroupSession(null);
  },[]);

  const handleDone=p=>{setPrefs(p);setShowOnboard(false);};
  const applyAndClose=f=>{setFilters(f);setShowFilter(false);};

  const recordGroupSwipe=useCallback((r,time)=>{
    // Update local swipe state
    setGroupSwipes(prev=>({...prev,[groupSession.myId]:{...(prev[groupSession.myId]||{}),[r.id]:"right"}}));
    // Update local time state
    if(time) setGroupTimes(prev=>({...prev,[groupSession.myId]:{...(prev[groupSession.myId]||{}),[r.id]:time}}));
    // Persist
    if(groupDBRef.current){
      groupDBRef.current.child(`swipes/${groupSession.myId}/${r.id}`).set("right");
      if(time) groupDBRef.current.child(`times/${groupSession.myId}/${r.id}`).set(time);
    } else {
      try{
        const key=`resy-session-${groupSession.code}`;
        const s=JSON.parse(localStorage.getItem(key)||"{}");
        s.swipes=s.swipes||{};s.swipes[groupSession.myId]=s.swipes[groupSession.myId]||{};
        s.swipes[groupSession.myId][r.id]="right";
        if(time){s.times=s.times||{};s.times[groupSession.myId]=s.times[groupSession.myId]||{};s.times[groupSession.myId][r.id]=time;}
        localStorage.setItem(key,JSON.stringify(s));
      }catch(_){}
    }
  },[groupSession]);

  const onSwipe=useCallback((dir,r)=>{
    if(dir==="notify"){setNotifyR(r);setIdx(i=>i+1);setTimeout(()=>setNotifyR(null),2800);return;}
    setIdx(i=>i+1);
    if(groupSession){
      if(dir==="right"){
        // Show time picker; swipe recorded after user picks a time
        const availTimes=(r.times.length>0?r.times:r.gdaTimes);
        if(availTimes.length>0){setPendingTimeR(r);return;}
        recordGroupSwipe(r,null);
      } else {
        // Left swipe — record immediately
        setGroupSwipes(prev=>({...prev,[groupSession.myId]:{...(prev[groupSession.myId]||{}),[r.id]:"left"}}));
        if(groupDBRef.current){groupDBRef.current.child(`swipes/${groupSession.myId}/${r.id}`).set("left");}
        else{try{const key=`resy-session-${groupSession.code}`;const s=JSON.parse(localStorage.getItem(key)||"{}");s.swipes=s.swipes||{};s.swipes[groupSession.myId]=s.swipes[groupSession.myId]||{};s.swipes[groupSession.myId][r.id]="left";localStorage.setItem(key,JSON.stringify(s));}catch(_){}}
      }
      return;
    }
    if(dir==="right"){
      if(r.notifyOnly&&!amexLinked){setNotifyR(r);setTimeout(()=>setNotifyR(null),2800);}
      else{const t=(r.notifyOnly?r.gdaTimes:r.times)[0];setMatch(r);setMatchTime(t);}
    }
  },[amexLinked,groupSession,recordGroupSwipe]);

  const fire=dir=>{setTrigger(dir);setTimeout(()=>setTrigger(null),80);};
  const onTime=useCallback((r,t)=>{setMatch(r);setMatchTime(t);},[]);
  const memberCount=Object.keys(groupMembers).length;

  return(
    <div style={{height:"100%",background:"#F5F4F0",display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>

      {/* ── Minimal context bar ── */}
      <div style={{padding:"8px 14px 6px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <Svg d={I.mapPin} size={11} stroke="#BBBBBB" sw={1.5}/>
          <span style={{fontSize:12,color:"#AAAAAA",fontWeight:500}}>Q Center, St. Charles</span>
          {prefs?.amexTier&&prefs.amexTier!=="skip"?(
            <button onClick={()=>setShowAmexPromo(true)} style={{display:"flex",alignItems:"center",gap:3,background:"#FFF5F4",borderRadius:5,padding:"2px 7px",border:"1px solid #FFE0DC",cursor:"pointer"}}>
              <div style={{width:4,height:4,borderRadius:"50%",background:"#FF4438"}}/>
              <span style={{fontSize:9,fontWeight:800,color:"#FF4438",letterSpacing:"0.4px"}}>AMEX</span>
            </button>
          ):(
            <button onClick={()=>setShowAmexPromo(true)} style={{display:"flex",alignItems:"center",gap:3,background:"#EEF4FF",borderRadius:5,padding:"2px 8px",border:"1px solid #C7DCFF",cursor:"pointer"}}>
              <span style={{fontSize:9,fontWeight:800,color:"#006FCF",letterSpacing:"0.4px"}}>✦ Get Amex</span>
            </button>
          )}
        </div>
        <div style={{display:"flex",gap:7}}>
          <button onClick={()=>setShowFilter(true)} style={{width:34,height:34,borderRadius:10,background:activeFilterCount>0?"#FF4438":"#FFF",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>
            <Svg d={I.sliders} size={14} stroke={activeFilterCount>0?"#FFF":"#666"} sw={1.75}/>
            {activeFilterCount>0&&<span style={{position:"absolute",top:-5,right:-5,background:"#1A1A1A",color:"#FFF",borderRadius:99,fontSize:8,fontWeight:800,padding:"1px 5px",minWidth:16,textAlign:"center",lineHeight:"14px"}}>{activeFilterCount}</span>}
          </button>
          <button onClick={()=>setShowGroup(true)} style={{width:34,height:34,borderRadius:10,background:"#FFF",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>
            <Svg d={I.users} size={14} stroke="#666" sw={1.75}/>
          </button>
        </div>
      </div>

      {/* Active filter chips — compact scrollable row */}
      {activeFilterCount>0&&(
        <div style={{display:"flex",gap:5,overflowX:"auto",scrollbarWidth:"none",padding:"0 14px 6px",flexShrink:0}}>
          {filters.groupSize&&(
            <button onClick={()=>setFilters(f=>({...f,groupSize:null}))} style={{display:"flex",alignItems:"center",gap:3,padding:"3px 9px",borderRadius:99,background:"#1A1A1A",border:"none",color:"#FFF",fontSize:10,fontWeight:600,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
              {["Just Me","Couple","3–5","6–10","Party 10+"][["solo","couple","small","large","party"].indexOf(filters.groupSize)]}
              <span style={{opacity:0.5,fontSize:9}}>×</span>
            </button>
          )}
          {filters.ambiance.map(a=>(
            <button key={a} onClick={()=>setFilters(f=>({...f,ambiance:f.ambiance.filter(x=>x!==a)}))} style={{display:"flex",alignItems:"center",gap:3,padding:"3px 9px",borderRadius:99,background:"#1A1A1A",border:"none",color:"#FFF",fontSize:10,fontWeight:600,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap",textTransform:"capitalize"}}>
              {a}<span style={{opacity:0.5,fontSize:9}}>×</span>
            </button>
          ))}
          {filters.cuisine&&filters.cuisine!=="all"&&(
            <button onClick={()=>setFilters(f=>({...f,cuisine:"all"}))} style={{display:"flex",alignItems:"center",gap:3,padding:"3px 9px",borderRadius:99,background:"#1A1A1A",border:"none",color:"#FFF",fontSize:10,fontWeight:600,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap",textTransform:"capitalize"}}>
              {filters.cuisine}<span style={{opacity:0.5,fontSize:9}}>×</span>
            </button>
          )}

        </div>
      )}

      {remaining>0&&(
        <div style={{padding:"10px 0 14px",display:"flex",justifyContent:"center",gap:20,alignItems:"center",flexShrink:0}}>

      {/* Join prompt — triggered by ?group=CODE in URL */}

              placeholder="Your name"
              maxLength={24}
              style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"1.5px solid #EEEEEE",fontSize:14,color:"#1A1A1A",outline:"none",background:"#FAFAFA",boxSizing:"border-box",marginBottom:12}}

      {/* Group results — ranked by vote count */}

      {showGroupResults&&(
        <GroupResultsOverlay
          ranked={sortedByVotes}

          groupSwipes={groupSwipes}
          groupTimes={groupTimes}

    </div>
  );
}

/* ── MAP VIEW ── */
function MapView({onSelect}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    const map=L.map(ref.current,{zoomControl:false}).setView(Q_CENTER,13);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
      attribution:'© OpenStreetMap © CartoDB',maxZoom:19
    }).addTo(map);
    L.control.zoom({position:"bottomright"}).addTo(map);

    // Q Center pin
    const youIcon=L.divIcon({html:`<div style="width:14px;height:14px;border-radius:50%;background:#1C1C1E;border:3px solid #FFF;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>`,iconSize:[14,14],className:""});
    L.marker(Q_CENTER,{icon:youIcon}).addTo(map).bindPopup(`<div style="font-family:-apple-system,sans-serif;font-size:12px;font-weight:700">Q Center</div>`);

    // Restaurant markers
    RESTAURANTS.forEach(r=>{
      const coords=COORDS[r.id];
      if(!coords)return;
      const open=!r.notifyOnly||r.gdaTimes.length>0;
      const times=(r.notifyOnly?r.gdaTimes:r.times).slice(0,3);
      const icon=L.divIcon({
        html:`<div style="width:36px;height:36px;border-radius:50%;background:${open?"#FF4438":"#AAAAAA"};border:3px solid #FFF;box-shadow:0 3px 10px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4v13"/><path d="M17 2v20"/><path d="M12 2v7c0 1.1-.9 2-2 2"/>
          </svg>
        </div>`,
        iconSize:[36,36],iconAnchor:[18,18],className:""
      });
      const timesHtml=times.length
        ?times.map(t=>`<span style="background:#FF4438;color:#fff;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;margin-right:4px">${t}</span>`).join("")
        :`<span style="color:#AAAAAA;font-size:11px">${r.notifyOnly?"GDA only":"Fully booked"}</span>`;
      const m=L.marker(coords,{icon}).addTo(map);
      m.bindPopup(`
        <div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;width:180px">
          <p style="margin:0 0 2px;font-size:14px;font-weight:800;color:#1A1A1A">${r.name}</p>
          <p style="margin:0 0 8px;font-size:11px;color:#999">${r.cuisine} · ${r.hood} · ${r.price}</p>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">${timesHtml}</div>
          <button onclick="window._resySelect(${r.id})" style="width:100%;padding:8px;background:#FF4438;color:#FFF;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">Reserve</button>
        </div>`,{maxWidth:200,className:"resy-popup"});
    });

    // Fit all points
    const allPts=[Q_CENTER,...RESTAURANTS.map(r=>COORDS[r.id]).filter(Boolean)];
    map.fitBounds(allPts,{padding:[28,28]});

    window._resySelect=id=>{const r=RESTAURANTS.find(x=>x.id===id);if(r&&onSelect)onSelect(r);map.closePopup();};
    return()=>{delete window._resySelect;map.remove();};
  },[]);
  return<div ref={ref} style={{width:"100%",height:"100%"}}/>;
}

/* ── RESERVATIONS SCREEN ── */
function ReservationsScreen({onDiscover,dynamicBookings}){
  const[tab,setTab]=useState("upcoming");
  const staticUpcoming=RESTAURANTS.filter(r=>r.upcoming);
  const allUpcoming=[...(dynamicBookings||[]).map(b=>({...b.r,_dynamic:true,_booking:b})),...staticUpcoming];
  const past=RESTAURANTS.filter(r=>r.past).slice(0,4);
  return(
    <div style={{height:"100%",background:"#FFF",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{padding:"14px 16px 0",flexShrink:0}}>
        <h1 style={{fontSize:20,fontWeight:800,color:"#1A1A1A",margin:"0 0 14px",letterSpacing:"-0.5px"}}>Reservations</h1>
        <div style={{display:"flex",borderBottom:"1.5px solid #F0F0F0"}}>
          {["upcoming","past"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"10px 0",background:"none",border:"none",borderBottom:`2px solid ${tab===t?"#FF4438":"transparent"}`,marginBottom:-2,color:tab===t?"#FF4438":"#AAAAAA",fontSize:14,fontWeight:tab===t?700:400,cursor:"pointer",textTransform:"capitalize",transition:"all 0.14s"}}>{t}</button>
          ))}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
        {tab==="upcoming"&&(allUpcoming.length===0?(
          <div style={{textAlign:"center",padding:"56px 0"}}>
            <div style={{width:60,height:60,borderRadius:"50%",background:"#F7F5F0",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Svg d={I.calendar} size={26} stroke="#CCCCCC"/></div>
            <h2 style={{fontSize:18,fontWeight:700,color:"#1A1A1A",margin:"0 0 7px"}}>Nothing booked yet</h2>
            <p style={{color:"#AAAAAA",fontSize:14,lineHeight:1.6,margin:"0 0 22px"}}>Time to discover somewhere new.</p>
            <button onClick={onDiscover} style={{padding:"12px 26px",borderRadius:11,background:"#FF4438",border:"none",color:"#FFF",fontSize:14,fontWeight:700,cursor:"pointer"}}>Discover Restaurants</button>
          </div>
        ):allUpcoming.map((r,i)=>{
          const bk=r._booking;
          return(
            <div key={i} style={{borderRadius:14,border:"1px solid #F0F0F0",padding:15,marginBottom:12,overflow:"hidden"}}>
              {r._dynamic&&<div style={{display:"flex",alignItems:"center",gap:5,marginBottom:9}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:"#22C55E"}}/>
                <span style={{fontSize:10,fontWeight:700,color:"#22C55E",letterSpacing:"0.3px"}}>Just Confirmed · {bk.code}</span>
              </div>}
              <div style={{display:"flex",gap:11,marginBottom:11}}>
                <div style={{width:60,height:60,borderRadius:10,overflow:"hidden",flexShrink:0}}><RestaurantImg r={r}/></div>
                <div>
                  <p style={{fontSize:15,fontWeight:700,color:"#1A1A1A",margin:"0 0 2px"}}>{r.name}</p>
                  <p style={{fontSize:12,color:"#AAAAAA",margin:"0 0 3px"}}>{r.cuisine} · {r.hood}</p>
                  <p style={{fontSize:12,fontWeight:600,color:"#555",margin:0}}>{r._dynamic?`${bk.date} · ${bk.time} · ${bk.party} guest${bk.party!==1?"s":""}`:`Fri, Aug 8 · ${r.times[0]||r.gdaTimes[0]} · 2 guests`}</p>
                </div>
              </div>
              <div style={{display:"flex",gap:9}}>
                <button style={{flex:1,padding:9,borderRadius:9,background:"#F7F7F7",border:"none",color:"#1A1A1A",fontSize:13,fontWeight:600,cursor:"pointer"}}>Modify</button>
                <button style={{flex:1,padding:9,borderRadius:9,background:"#FFF",border:"1px solid #EEEEEE",color:"#AAAAAA",fontSize:13,cursor:"pointer"}}>Cancel</button>
              </div>
            </div>
          );
        }))}
        {tab==="past"&&past.map(r=>(
          <div key={r.id} style={{display:"flex",alignItems:"center",gap:11,padding:"12px 0",borderBottom:"1px solid #F5F5F5"}}>
            <div style={{width:46,height:46,borderRadius:9,overflow:"hidden",flexShrink:0}}><RestaurantImg r={r}/></div>
            <div style={{flex:1}}>
              <p style={{fontSize:14,fontWeight:600,color:"#1A1A1A",margin:"0 0 2px"}}>{r.name}</p>
              <p style={{fontSize:11,color:"#AAAAAA",margin:0}}>{r.cuisine} · {r.hood}</p>
            </div>
            <button style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #FF4438",background:"none",color:"#FF4438",fontSize:12,fontWeight:600,cursor:"pointer",flexShrink:0}}>Book Again</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── PROFILE SCREEN ── */
function ProfileScreen(){
  const storedName=localStorage.getItem('resy_name')||'';
  const displayName=storedName||'Guest';
  const initials=storedName.trim().split(/\s+/).map(w=>w[0]?.toUpperCase()||'').join('').slice(0,2)||'?';
  const rows=[
    {icon:I.bookmark,label:"Saved Restaurants",note:"8"},
    {icon:I.star,label:"Dining Preferences"},
    {icon:I.card,label:"Payment Methods"},
    {icon:I.bell,label:"Notifications"},
    {icon:I.help,label:"Help & Support"},
    {icon:I.settings,label:"Account Settings"},
  ];
  return(
    <div style={{height:"100%",background:"#FFF",display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{flex:1,overflowY:"auto",padding:"14px 0 80px"}}>
        <div style={{padding:"4px 16px 20px",borderBottom:"1px solid #F5F5F5",marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
            <div style={{width:62,height:62,borderRadius:"50%",background:"#FF4438",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{color:"#FFF",fontSize:20,fontWeight:800}}>{initials}</span>
            </div>
            <div>
              <p style={{fontSize:18,fontWeight:800,color:"#1A1A1A",margin:"0 0 2px"}}>{displayName}</p>
              <p style={{fontSize:12,color:"#AAAAAA",margin:"0 0 7px"}}>Member since January 2021</p>
              <div style={{display:"flex",gap:6}}>
                <span style={{background:"#FF4438",color:"#FFF",fontSize:9,fontWeight:800,padding:"3px 8px",borderRadius:4,letterSpacing:"0.6px"}}>RESY BLACK</span>
                <span style={{background:"#1C1C1E",color:"#FFF",fontSize:9,fontWeight:800,padding:"3px 8px",borderRadius:4,letterSpacing:"0.6px"}}>AMEX ★ PLATINUM</span>
              </div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:1,background:"#F0F0F0",borderRadius:12,overflow:"hidden"}}>
            {[["47","Reservations"],["31","Restaurants"],["4","Cities"]].map(([n,l])=>(
              <div key={l} style={{background:"#F9F9F9",padding:"12px 6px",textAlign:"center"}}>
                <p style={{fontSize:19,fontWeight:800,color:"#1A1A1A",margin:"0 0 2px"}}>{n}</p>
                <p style={{fontSize:9,color:"#AAAAAA",margin:0,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.5px"}}>{l}</p>
              </div>
            ))}
          </div>
        </div>
        <div style={{margin:"6px 16px 12px",background:"#FFF5F4",border:"1px solid #FFE0DC",borderRadius:11,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:12,fontWeight:700,color:"#FF4438",margin:"0 0 2px"}}>Global Dining Access · Active</p>
            <p style={{fontSize:11,color:"#AAAAAA",margin:0}}>Priority Notify · Exclusive availability · $100/quarter</p>
          </div>
          <Svg d={I.star} size={17} stroke="#FF4438" fill="#FF4438" sw={0}/>
        </div>
        {rows.map((s,i)=>(
          <button key={i} style={{width:"100%",display:"flex",alignItems:"center",gap:13,padding:"13px 16px",background:"none",border:"none",borderBottom:"1px solid #F5F5F5",cursor:"pointer",textAlign:"left"}}>
            <div style={{width:34,height:34,borderRadius:8,background:"#F7F7F7",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <Svg d={s.icon} size={16} stroke="#555" sw={1.75}/>
            </div>
            <span style={{flex:1,fontSize:15,color:"#1A1A1A",fontWeight:500}}>{s.label}</span>
            {s.note&&<span style={{fontSize:13,color:"#AAAAAA",marginRight:4}}>{s.note}</span>}
            <Svg d={I.chevR} size={17} stroke="#DDDDDD" sw={1.5}/>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── BOTTOM NAV ── */
function BottomNav({tab,setTab}){
  const wide=window.innerWidth>430;
  const tabs=[
    {id:"discover",label:"Discover",icon:I.compass},
    {id:"restaurants",label:"Browse",icon:I.search},
    {id:"reservations",label:"Reservations",icon:I.calendar},
    {id:"profile",label:"Profile",icon:I.user},
  ];
  return(
    <div style={{background:"#FFF",borderTop:"1px solid #F0F0F0",display:"flex",
      paddingBottom:wide?22:4,borderRadius:wide?"0 0 38px 38px":0,flexShrink:0,zIndex:50}}>
      {tabs.map(t=>{
        const a=tab===t.id;
        return(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0 5px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:a?"#FF4438":"#BBBBBB",transition:"color 0.14s"}}>
            <Svg d={t.icon} size={22} stroke={a?"#FF4438":"#BBBBBB"} sw={a?2:1.5}/>
            <span style={{fontSize:"10px",fontWeight:a?700:400,letterSpacing:"0.1px"}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ── APP ── */
function App(){
  const[tab,setTab]=useState("discover");
  const[bookings,setBookings]=useState([]);
  const[activeGroupCode,setActiveGroupCode]=useState(null);
  const isWide=window.innerWidth>430;
  const addBooking=useCallback(b=>setBookings(p=>[b,...p]),[]);
  const goToReservations=useCallback(()=>setTab("reservations"),[]);
  useEffect(()=>{
    const url=activeGroupCode?`${window.location.origin}${window.location.pathname}?group=${activeGroupCode}`:null;
    window.parent.postMessage({type:'resyGroupCode',code:activeGroupCode,url},'*');
  },[activeGroupCode]);
  const groupUrl=activeGroupCode?`${window.location.origin}${window.location.pathname}?group=${activeGroupCode}`:null;
  const qrSrc=activeGroupCode
    ?`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(groupUrl)}&color=1A1A1A&bgcolor=FFFFFF`
    :null;
  return(
    <div style={{minHeight:"100vh",background:"#EDEBE7",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>

      {/* Phone mockup — no overflow:hidden so nav is never clipped */}
      <div style={{width:isWide?390:"100%",maxWidth:390,height:"100vh",position:"relative",background:"#FFF",
        boxShadow:isWide?"0 0 0 1px rgba(0,0,0,0.06),0 28px 72px rgba(0,0,0,0.20)":"none",
        borderRadius:isWide?44:0,display:"flex",flexDirection:"column",flexShrink:0}}>

        {/* Dynamic phone outline (replaces overflow:hidden for visual rounding) */}
        {isWide&&<div style={{position:"absolute",inset:0,borderRadius:44,boxShadow:"inset 0 0 0 1px rgba(0,0,0,0.07)",pointerEvents:"none",zIndex:400}}/>}
        {/* Notch */}
        {isWide&&<div style={{position:"absolute",top:13,left:"50%",transform:"translateX(-50%)",width:100,height:22,background:"#1C1C1E",borderRadius:11,zIndex:401}}/>}

        {/* App header */}
        <div style={{padding:`${isWide?42:30}px 16px 9px`,background:"#FFF",flexShrink:0,
          borderBottom:"1px solid #F5F5F5",zIndex:40,
          borderRadius:isWide?"38px 38px 0 0":0}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontWeight:900,fontSize:24,letterSpacing:"-1.5px",color:"#FF4438"}}>resy</span>
            <div style={{display:"flex",gap:4}}>
              <button style={{background:"none",border:"none",cursor:"pointer",padding:6,borderRadius:8}}><Svg d={I.mapPin} size={19} stroke="#555" sw={1.75}/></button>
              <button style={{background:"none",border:"none",cursor:"pointer",padding:6,borderRadius:8}}><Svg d={I.bell} size={19} stroke="#555" sw={1.75}/></button>
            </div>
          </div>
        </div>

        {/* Tab content — overflow:hidden here catches card swipes */}
        <div style={{flex:1,position:"relative",overflow:"hidden"}}>
          <div style={{display:tab==="discover"?"flex":"none",flexDirection:"column",height:"100%"}}><DiscoverScreen onBookingConfirmed={addBooking} goToReservations={goToReservations} onGroupSession={setActiveGroupCode}/></div>
          <div style={{display:tab==="restaurants"?"flex":"none",flexDirection:"column",height:"100%"}}><RestaurantsScreen/></div>
          <div style={{display:tab==="reservations"?"flex":"none",flexDirection:"column",height:"100%"}}><ReservationsScreen onDiscover={()=>setTab("discover")} dynamicBookings={bookings}/></div>
          <div style={{display:tab==="profile"?"flex":"none",flexDirection:"column",height:"100%"}}><ProfileScreen/></div>
        </div>

        {/* Nav is a normal flex child — never clipped */}
        <BottomNav tab={tab} setTab={setTab}/>
      </div>

      {/* QR code panel — right of phone, desktop only, only when group session active */}
      {isWide&&activeGroupCode&&(
        <div style={{position:"absolute",left:"calc(50% + 222px)",top:"50%",transform:"translateY(-50%)",
          display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
          <div style={{background:"#FFF",borderRadius:20,padding:18,boxShadow:"0 8px 32px rgba(0,0,0,0.10)",display:"flex",flexDirection:"column",alignItems:"center",gap:12}}>
            <img src={qrSrc} width={152} height={152} style={{display:"block",borderRadius:8}} alt="QR code"/>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontWeight:900,fontSize:17,letterSpacing:"-0.6px",color:"#FF4438"}}>resy</span>
              {activeGroupCode
                ?<><p style={{fontSize:11,color:"#22C55E",fontWeight:700,margin:0,textAlign:"center"}}>Group · {activeGroupCode}</p>
                   <p style={{fontSize:10,color:"#AAAAAA",margin:0,textAlign:"center"}}>Scan to join the session</p></>
                :<p style={{fontSize:11,color:"#AAAAAA",margin:0,textAlign:"center",lineHeight:1.6}}>Scan to open on your phone</p>}
            </div>
          </div>
          <div style={{background:"rgba(255,255,255,0.7)",backdropFilter:"blur(8px)",borderRadius:12,padding:"8px 14px",border:"1px solid rgba(255,255,255,0.9)"}}>
            <p style={{fontSize:10,color:"#AAAAAA",margin:0,textAlign:"center",letterSpacing:"0.3px"}}>St. Charles, IL · Live Demo</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
